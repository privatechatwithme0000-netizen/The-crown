[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forex-lab"
version = "0.1.0"
description = "AI Forex Lab - deterministic forex strategy research and paper-trading platform (Phase 1)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "httpx>=0.27",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-python-dateutil>=2.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:forex_lab.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C4", "RUF"]
ignore = [
    "B008",    # FastAPI Depends() in default args is idiomatic
    "RUF009",  # Decimal defaults call dec(); Decimal is immutable so this is safe
    "UP042",   # str+Enum is deliberate for JSON/pydantic value serialization
]

[tool.ruff.lint.isort]
known-first-party = ["forex_lab"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["forex_lab"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["redis.*", "MetaTrader5.*"]
ignore_missing_imports = true
