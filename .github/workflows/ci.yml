name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.5'

      - name: Check syntax
        run: |
          for f in server/*.js public/*.js; do node --check "$f"; done

      - name: Run test suite
        run: node --test
